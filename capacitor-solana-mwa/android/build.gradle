apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "fr.kristen.lastmanskating.solana"
    compileSdk 36

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'com.solanamobile:mobile-wallet-adapter-clientlib-ktx:2.0.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.activity:activity-ktx:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // Nearby Connections (mode PROXIMITÉ) — vérifier sur maven.google.com si une version plus
    // récente est sortie avant de builder.
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'
}
configurations.all {
    resolutionStrategy {
        force 'androidx.activity:activity-ktx:1.11.0'
        force 'androidx.activity:activity:1.11.0'
        force 'androidx.core:core-ktx:1.17.0'
        force 'androidx.core:core:1.17.0'
    }
}